name: Feature request
description: Propose a PiPy capability or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need before the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should PiPy do differently?
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architectural impact
      description: Does this affect discovery, trust, membership, consensus, scheduling, workloads, telemetry, or deployment?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps PiPy focused on a self-organizing distributed compute fabric rather than general fleet/container orchestration.
