[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pipy"
version = "0.1.0"
description = "Self-organizing distributed compute fabric for Raspberry Pi clusters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kelly Eldritch"}]
dependencies = [
  "cryptography>=43",
  "platformdirs>=4.3",
  "typer>=0.12",
  "rich>=13.9",
  "bleak>=0.22",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
pipy = "pipy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pipy"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
