[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pipy"
version = "0.1.0"
description = "Self-organizing distributed compute fabric for Raspberry Pi clusters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Kelly Eldritch"}]
keywords = ["raspberry-pi", "distributed-computing", "cluster", "asyncio", "pi", "chudnovsky"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "cryptography>=43",
  "platformdirs>=4.3",
  "typer>=0.12",
  "rich>=13.9",
  "bleak>=0.22",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/kellyjanderson/pipy"
Repository = "https://github.com/kellyjanderson/pipy"
Issues = "https://github.com/kellyjanderson/pipy/issues"
Documentation = "https://github.com/kellyjanderson/pipy/blob/main/ARCHITECTURE.md"

[project.scripts]
pipy = "pipy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pipy"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with correctness checks; broad style normalization can be a separate change.
select = ["E9", "F63", "F7", "F82"]
